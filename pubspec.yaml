version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  convex_bottom_bar: ^3.2.0
  faker: ^2.1.0
  intl: any
  dropdown_search: ^5.0.6
  avatar_glow: ^3.0.1

flutter:
  uses-material-design: true